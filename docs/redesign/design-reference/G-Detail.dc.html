<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — Exercise detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pl-light{--bg:#F4F2EE;--surface:#FFFFFF;--ink:#121417;--muted:#6B6E76;--faint:#9A9DA4;--placeholder:#8A8D94;--fill:#F4F2EE;--fill2:#ECE9E3;--line:rgba(18,20,23,0.08);--line2:rgba(18,20,23,0.17);--dot:rgba(18,20,23,0.13);--ring:#121417;--card:0 1px 2px rgba(18,20,23,0.04);--hero:#121417;--on-hero:#F4F2EE;--tabbar:#121417;--tabshadow:0 10px 30px rgba(18,20,23,0.18);--danger:#C2361B;--pb-ink:#B5371A;color-scheme:light}
.pl-dark{--bg:#0F1012;--surface:#1A1C20;--ink:#F1EFEA;--muted:#9C9EA6;--faint:#6E7179;--placeholder:#7C7F86;--fill:#26282D;--fill2:#24262B;--line:rgba(241,239,234,0.08);--line2:rgba(241,239,234,0.18);--dot:rgba(241,239,234,0.14);--ring:#F1EFEA;--card:0 0 0 1px rgba(241,239,234,0.06);--hero:#202228;--on-hero:#F1EFEA;--tabbar:#202228;--tabshadow:0 0 0 1px rgba(241,239,234,0.08),0 10px 30px rgba(0,0,0,0.4);--danger:#FF7A63;--pb-ink:#FF8A6B;color-scheme:dark}
a{color:var(--ink)}a:hover{opacity:0.8}
</style>
</helmet>
<div class="pl-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', sans-serif; padding: 60px 24px 0; display: flex; flex-direction: column">
  <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
    <a href="G-Library.dc.html" aria-label="Back to library" style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface); box-shadow: var(--card); display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>
    </a>
    <span></span><span></span>
  </div>

  <div role="img" aria-label="Exercise photo, {{frameName}} position" style="position: relative; overflow: hidden; margin-top: 16px; height: 280px; border-radius: 28px; background: var(--surface); box-shadow: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--faint)">
    <svg width="400" height="400" viewBox="0 0 400 400" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; margin: -200px 0 0 -200px">
      <sc-for list="{{rings}}" as="r" hint-placeholder-count="5"><circle cx="200" cy="200" r="{{r.r}}" fill="none" stroke="#F2542D" stroke-opacity="{{r.o}}" stroke-width="1"></circle></sc-for>
    </svg>
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="position: relative" aria-hidden="true"><circle cx="17" cy="6" r="2"></circle><path d="M3 17h4l4-3 6 1M11 14l-1-5 5 1"></path></svg>
    <span style="position: relative; font-size: 13px">Pushups/{{frameFile}}</span>
    <div style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(2, 72px); padding: 3px; border-radius: 18px; background: var(--fill)" role="group" aria-label="Photo frame">
      <sc-for list="{{frames}}" as="f" hint-placeholder-count="2">
        <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 30px; border-radius: 15px; border: none; background: {{f.bg}}; color: var(--ink); box-shadow: {{f.shadow}}; font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 500">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <h1 style="margin: 22px 0 0; font-size: 30px; font-weight: 500; letter-spacing: -0.02em">Push-up</h1>
  <span style="margin-top: 6px; font-size: 14px; color: var(--muted)">Chest · also shoulders and triceps</span>
  <div style="margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap">
    <span style="height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(242,84,45,0.12); color: var(--pb-ink); display: flex; align-items: center; font-size: 13px; font-weight: 500">Best 12 reps</span>
    <sc-for list="{{tags}}" as="g" hint-placeholder-count="3">
      <span style="height: 28px; padding: 0 12px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; font-size: 13px">{{g}}</span>
    </sc-for>
  </div>

  <ol style="margin: 20px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 15px; line-height: 1.45">
        <span style="width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">{{s.n}}</span><span style="padding-top: 3px">{{s.t}}</span>
      </li>
    </sc-for>
  </ol>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 30px; display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 10px">
    <a href="G-Player.dc.html" style="height: 56px; border-radius: 28px; background: var(--surface); box-shadow: var(--card); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Try it</a>
    <button style="height: 56px; border-radius: 28px; border: none; background: var(--ink); color: var(--bg); font-family: 'Geist', sans-serif; font-size: 15px; font-weight: 600">Add to workout</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { frame: 0 }; }
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const rings = [50, 80, 112, 146, 184].map((r, i) => ({ r, o: (0.22 - i * 0.04).toFixed(3) }));
    const names = ['Start', 'End'];
    const frames = names.map((label, i) => {
      const on = this.state.frame === i;
      return { label, pressed: on ? 'true' : 'false', bg: on ? 'var(--surface)' : 'transparent', shadow: on ? '0 1px 3px rgba(18,20,23,0.1)' : 'none', pick: () => this.setState({ frame: i }) };
    });
    const tags = ['Beginner', 'Body only', 'Compound'];
    const steps = [
      { n: '1', t: 'Hands just wider than shoulders, body in a straight line.' },
      { n: '2', t: 'Lower until your chest is a fist above the floor, elbows at 45°.' },
      { n: '3', t: 'Press back up without letting your hips sag.' }
    ];
    return { rings, frames, tags, steps, frameName: names[this.state.frame].toLowerCase(), frameFile: this.state.frame + '.jpg' };
  }
}
</script>
</body>
</html>
