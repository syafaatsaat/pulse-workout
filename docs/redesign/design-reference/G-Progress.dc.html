<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — Progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pl-light{--bg:#F4F2EE;--surface:#FFFFFF;--ink:#121417;--muted:#6B6E76;--faint:#9A9DA4;--placeholder:#8A8D94;--fill:#F4F2EE;--fill2:#ECE9E3;--line:rgba(18,20,23,0.08);--line2:rgba(18,20,23,0.17);--dot:rgba(18,20,23,0.13);--ring:#121417;--card:0 1px 2px rgba(18,20,23,0.04);--hero:#121417;--on-hero:#F4F2EE;--tabbar:#121417;--tabshadow:0 10px 30px rgba(18,20,23,0.18);--danger:#C2361B;--pb-ink:#B5371A;color-scheme:light}
.pl-dark{--bg:#0F1012;--surface:#1A1C20;--ink:#F1EFEA;--muted:#9C9EA6;--faint:#6E7179;--placeholder:#7C7F86;--fill:#26282D;--fill2:#24262B;--line:rgba(241,239,234,0.08);--line2:rgba(241,239,234,0.18);--dot:rgba(241,239,234,0.14);--ring:#F1EFEA;--card:0 0 0 1px rgba(241,239,234,0.06);--hero:#202228;--on-hero:#F1EFEA;--tabbar:#202228;--tabshadow:0 0 0 1px rgba(241,239,234,0.08),0 10px 30px rgba(0,0,0,0.4);--danger:#FF7A63;--pb-ink:#FF8A6B;color-scheme:dark}
a{color:var(--ink)}a:hover{opacity:0.8}
</style>
</helmet>
<div class="pl-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', sans-serif; padding: 60px 24px 0; display: flex; flex-direction: column">
  <svg width="420" height="420" viewBox="0 0 420 420" aria-hidden="true" style="position: absolute; right: -210px; top: -170px">
    <sc-for list="{{rings}}" as="r" hint-placeholder-count="5"><circle cx="210" cy="210" r="{{r.r}}" fill="none" stroke="currentColor" style="color: var(--ring)" stroke-opacity="{{r.o}}" stroke-width="1"></circle></sc-for>
  </svg>

  <div style="position: relative; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 14px; color: var(--muted)">14 sessions in October</span>
    <h1 style="margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -0.02em">Progress</h1>
  </div>

  <section style="position: relative; margin-top: 20px; border-radius: 24px; background: var(--surface); box-shadow: var(--card); padding: 10px 14px 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <button aria-label="Previous month" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg></button>
      <span style="font-size: 16px; font-weight: 500">October 2026</span>
      <button aria-label="Next month" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></button>
    </div>
    <div style="margin-top: 4px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
      <sc-for list="{{dow}}" as="d" hint-placeholder-count="7">
        <span style="text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0">{{d}}</span>
      </sc-for>
      <sc-for list="{{days}}" as="c" hint-placeholder-count="35">
        <a href="G-Summary.dc.html" aria-label="{{c.aria}}" style="justify-self: center; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; background: {{c.bg}}; color: {{c.ink}}; font-size: 14px; font-variant-numeric: tabular-nums; visibility: {{c.vis}}">{{c.n}}</a>
      </sc-for>
    </div>
  </section>

  <div style="position: relative; margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
      <div style="border-radius: 20px; background: var(--surface); box-shadow: var(--card); padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; font-weight: 400; letter-spacing: -0.02em">{{s.v}}</span>
        <span style="font-size: 12px; color: var(--muted)">{{s.k}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: relative; margin-top: 22px; display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 17px; font-weight: 500">Personal bests</span>
    <span style="font-size: 13px; color: var(--muted)">Last 6 weeks</span>
  </div>
  <div style="position: relative; margin-top: 10px; border-radius: 22px; background: var(--surface); box-shadow: var(--card); padding: 2px 18px">
    <sc-for list="{{bests}}" as="b" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 60px 60px; gap: 12px; align-items: center; min-height: 54px; border-top: {{b.line}}">
        <span style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.name}}</span>
        <span style="display: flex; gap: 3px; align-items: flex-end; height: 20px" aria-hidden="true">
          <sc-for list="{{b.bars}}" as="v" hint-placeholder-count="6"><span style="flex: 1; height: {{v.h}}px; border-radius: 2px; background: {{v.fill}}"></span></sc-for>
        </span>
        <span style="text-align: right; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums">{{b.best}}</span>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 30px; height: 64px; border-radius: 32px; background: var(--tabbar); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; box-shadow: var(--tabshadow)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" aria-label="{{t.label}}" aria-current="{{t.current}}" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: {{t.color}}; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span style="width: 4px; height: 4px; border-radius: 50%; background: {{t.dot}}"></span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const rings = [40, 80, 120, 160, 200].map((r, i) => ({ r, o: (0.09 - i * 0.015).toFixed(3) }));
    const dow = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const done = [1, 3, 5, 6, 8, 10, 13, 15, 17, 20, 22, 24, 26, 28];
    const days = [];
    for (let i = 0; i < 3; i++) days.push({ n: '', vis: 'hidden', bg: 'transparent', ink: 'var(--ink)', aria: 'blank' });
    for (let d = 1; d <= 31; d++) {
      const on = done.includes(d);
      days.push({ n: String(d), vis: 'visible', bg: on ? 'var(--ink)' : 'transparent', ink: on ? 'var(--bg)' : 'var(--ink)', aria: d + ' October' + (on ? ', session logged' : '') });
    }
    days.push({ n: '', vis: 'hidden', bg: 'transparent', ink: 'var(--ink)', aria: 'blank' });
    const stats = [{ v: '3 wks', k: 'Goal streak' }, { v: '3.5', k: 'Per week' }, { v: '6h 20m', k: 'Time' }];
    const mk = (name, vals, best, max) => ({ name, best, bars: vals.map((v, i) => ({ h: Math.max(3, Math.round(v / max * 20)), fill: i === vals.length - 1 ? '#F2542D' : 'var(--dot)' })) });
    const bests = [
      mk('Push-up', [8, 8, 9, 10, 10, 12], '12', 12),
      mk('Plank', [45, 50, 60, 60, 75, 90], '01:30', 90),
      mk('Squat', [20, 22, 25, 25, 28, 30], '30', 30)
    ].map((b, i) => ({ ...b, line: i === 0 ? 'none' : '1px solid var(--line)' }));
    const T = [
      ['Today', 'G-Today.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['Library', 'G-Library.dc.html', 'M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5z'],
      ['Progress', 'G-Progress.dc.html', 'M3 20h18M6 20V11M11 20V5M16 20v-6M21 20V9'],
      ['Settings', 'G-Settings.dc.html', 'M4 7h9M17 7h3M15 4v6M4 17h3M11 17h9M9 14v6']
    ];
    const active = 2;
    const tabs = T.map(([label, href, d], i) => ({ label, href, d, current: i === active ? 'page' : 'false', color: i === active ? '#F1EFEA' : 'rgba(244,242,238,0.45)', dot: i === active ? '#F2542D' : 'transparent' }));
    return { rings, dow, days, stats, bests, tabs };
  }
}
</script>
</body>
</html>
