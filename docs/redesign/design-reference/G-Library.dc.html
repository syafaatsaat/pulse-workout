<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pl-light{--bg:#F4F2EE;--surface:#FFFFFF;--ink:#121417;--muted:#6B6E76;--faint:#9A9DA4;--placeholder:#8A8D94;--fill:#F4F2EE;--fill2:#ECE9E3;--line:rgba(18,20,23,0.08);--line2:rgba(18,20,23,0.17);--dot:rgba(18,20,23,0.13);--ring:#121417;--card:0 1px 2px rgba(18,20,23,0.04);--hero:#121417;--on-hero:#F4F2EE;--tabbar:#121417;--tabshadow:0 10px 30px rgba(18,20,23,0.18);--danger:#C2361B;--pb-ink:#B5371A;color-scheme:light}
.pl-dark{--bg:#0F1012;--surface:#1A1C20;--ink:#F1EFEA;--muted:#9C9EA6;--faint:#6E7179;--placeholder:#7C7F86;--fill:#26282D;--fill2:#24262B;--line:rgba(241,239,234,0.08);--line2:rgba(241,239,234,0.18);--dot:rgba(241,239,234,0.14);--ring:#F1EFEA;--card:0 0 0 1px rgba(241,239,234,0.06);--hero:#202228;--on-hero:#F1EFEA;--tabbar:#202228;--tabshadow:0 0 0 1px rgba(241,239,234,0.08),0 10px 30px rgba(0,0,0,0.4);--danger:#FF7A63;--pb-ink:#FF8A6B;color-scheme:dark}
a{color:var(--ink)}a:hover{opacity:0.8}
input::placeholder{color:var(--placeholder)}
</style>
</helmet>
<div class="pl-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', sans-serif; padding: 60px 24px 0; display: flex; flex-direction: column">
  <svg width="420" height="420" viewBox="0 0 420 420" aria-hidden="true" style="position: absolute; right: -210px; top: -170px">
    <sc-for list="{{rings}}" as="r" hint-placeholder-count="5"><circle cx="210" cy="210" r="{{r.r}}" fill="none" stroke="currentColor" style="color: var(--ring)" stroke-opacity="{{r.o}}" stroke-width="1"></circle></sc-for>
  </svg>

  <div style="position: relative; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 14px; color: var(--muted)">800+ exercises</span>
    <h1 style="margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -0.02em">Library</h1>
  </div>

  <label for="g-search" style="position: relative; margin-top: 20px; height: 52px; border-radius: 26px; background: var(--surface); box-shadow: var(--card); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 18px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16" y2="16"></line></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</span>
    <input id="g-search" type="search" placeholder="Search exercises" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Geist', sans-serif; font-size: 16px; color: var(--ink)">
    <button aria-label="Filters: Body only" style="width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
    </button>
  </label>

  <div style="position: relative; margin-top: 14px; display: flex; gap: 6px; overflow: hidden">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
      <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex-shrink: 0; height: 36px; padding: 0 16px; border-radius: 18px; border: none; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="position: relative; margin-top: 20px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a href="G-Detail.dc.html" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 16px; gap: 14px; align-items: center; padding: 10px 14px 10px 10px; border-radius: 20px; background: var(--surface); box-shadow: var(--card); text-decoration: none">
        <span aria-hidden="true" style="position: relative; overflow: hidden; width: 56px; height: 56px; border-radius: 14px; background: var(--fill2); display: flex; align-items: center; justify-content: center; color: var(--faint)">
          <svg width="56" height="56" viewBox="0 0 56 56" style="position: absolute; left: 0; top: 0"><circle cx="28" cy="28" r="12" fill="none" stroke="currentColor" style="color: var(--ring)" stroke-opacity="0.06"></circle><circle cx="28" cy="28" r="20" fill="none" stroke="currentColor" style="color: var(--ring)" stroke-opacity="0.04"></circle></svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="position: relative"><circle cx="17" cy="6" r="2"></circle><path d="M3 17h4l4-3 6 1M11 14l-1-5 5 1"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
          <span style="font-size: 13px; color: var(--muted)">{{r.meta}}</span>
        </span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--faint)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 30px; height: 64px; border-radius: 32px; background: var(--tabbar); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; box-shadow: var(--tabshadow)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" aria-label="{{t.label}}" aria-current="{{t.current}}" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: {{t.color}}; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span style="width: 4px; height: 4px; border-radius: 50%; background: {{t.dot}}"></span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { muscle: 'Chest' }; }
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const rings = [40, 80, 120, 160, 200].map((r, i) => ({ r, o: (0.09 - i * 0.015).toFixed(3) }));
    const chips = ['All', 'Chest', 'Core', 'Legs', 'Back', 'Shoulders'].map((label) => {
      const on = this.state.muscle === label;
      return { label, pressed: on ? 'true' : 'false', bg: on ? 'var(--ink)' : 'var(--surface)', ink: on ? 'var(--bg)' : 'var(--ink)', pick: () => this.setState({ muscle: label }) };
    });
    const rows = [
      { name: 'Push-up', meta: 'Chest, triceps · Beginner' },
      { name: 'Incline push-up', meta: 'Chest, shoulders · Beginner' },
      { name: 'Decline push-up', meta: 'Chest, shoulders · Intermediate' },
      { name: 'Wide-grip push-up', meta: 'Chest, triceps · Beginner' },
      { name: 'Push-up to side plank', meta: 'Chest, core · Intermediate' },
      { name: 'Chair dip', meta: 'Triceps, chest · Beginner' }
    ];
    const T = [
      ['Today', 'G-Today.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['Library', 'G-Library.dc.html', 'M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5z'],
      ['Progress', 'G-Progress.dc.html', 'M3 20h18M6 20V11M11 20V5M16 20v-6M21 20V9'],
      ['Settings', 'G-Settings.dc.html', 'M4 7h9M17 7h3M15 4v6M4 17h3M11 17h9M9 14v6']
    ];
    const active = 1;
    const tabs = T.map(([label, href, d], i) => ({ label, href, d, current: i === active ? 'page' : 'false', color: i === active ? '#F1EFEA' : 'rgba(244,242,238,0.45)', dot: i === active ? '#F2542D' : 'transparent' }));
    return { rings, chips, rows, tabs };
  }
}
</script>
</body>
</html>
