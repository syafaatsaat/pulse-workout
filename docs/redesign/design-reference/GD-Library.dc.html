<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — Desktop Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pl-light{--bg:#F4F2EE;--surface:#FFFFFF;--ink:#121417;--muted:#6B6E76;--faint:#9A9DA4;--placeholder:#8A8D94;--fill:#F4F2EE;--fill2:#ECE9E3;--line:rgba(18,20,23,0.08);--line2:rgba(18,20,23,0.17);--dot:rgba(18,20,23,0.13);--ring:#121417;--card:0 1px 2px rgba(18,20,23,0.04);--hero:#121417;--on-hero:#F4F2EE;--tabbar:#121417;--tabshadow:0 10px 30px rgba(18,20,23,0.18);--danger:#C2361B;--pb-ink:#B5371A;color-scheme:light}
.pl-dark{--bg:#0F1012;--surface:#1A1C20;--ink:#F1EFEA;--muted:#9C9EA6;--faint:#6E7179;--placeholder:#7C7F86;--fill:#26282D;--fill2:#24262B;--line:rgba(241,239,234,0.08);--line2:rgba(241,239,234,0.18);--dot:rgba(241,239,234,0.14);--ring:#F1EFEA;--card:0 0 0 1px rgba(241,239,234,0.06);--hero:#202228;--on-hero:#F1EFEA;--tabbar:#202228;--tabshadow:0 0 0 1px rgba(241,239,234,0.08),0 10px 30px rgba(0,0,0,0.4);--danger:#FF7A63;--pb-ink:#FF8A6B;color-scheme:dark}
a{color:var(--ink)}a:hover{opacity:0.85}
input::placeholder{color:var(--placeholder)}
</style>
</helmet>
<div class="pl-{{theme}}" style="min-height: 100vh; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', sans-serif; display: flex; flex-wrap: wrap">
  <nav aria-label="Main" style="position: relative; flex: 1 1 220px; box-sizing: border-box; padding: 32px 20px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 32px">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="4" fill="#F2542D"></circle><circle cx="13" cy="13" r="8" fill="none" stroke="#F2542D" stroke-opacity="0.5"></circle><circle cx="13" cy="13" r="12" fill="none" stroke="#F2542D" stroke-opacity="0.25"></circle></svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Pulse</span>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <a href="{{n.href}}" aria-current="{{n.current}}" style="height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 22px; text-decoration: none; background: {{n.bg}}; color: {{n.color}}; font-size: 15px; font-weight: 500">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}
      </a>
    </sc-for>
  </nav>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-wrap: wrap; gap: 24px; padding: 40px 48px 48px 8px; box-sizing: border-box">
    <section aria-label="Exercise list" style="flex: 1 1 340px; max-width: 420px; display: flex; flex-direction: column">
      <span style="font-size: 15px; color: var(--muted)">800+ exercises</span>
      <h1 style="margin: 4px 0 0; font-size: 40px; font-weight: 500; letter-spacing: -0.02em">Library</h1>
      <label for="gd-search" style="position: relative; margin-top: 20px; height: 52px; border-radius: 26px; background: var(--surface); box-shadow: var(--card); display: flex; align-items: center; gap: 10px; padding: 0 12px 0 18px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16" y2="16"></line></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</span>
        <input id="gd-search" type="search" placeholder="Search exercises" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Geist', sans-serif; font-size: 15px; color: var(--ink)">
        <span style="font-size: 12px; color: var(--muted); background: var(--fill); border-radius: 6px; padding: 2px 8px">/</span>
      </label>
      <div style="margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
          <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 36px; padding: 0 16px; border-radius: 18px; border: none; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500">{{c.label}}</button>
        </sc-for>
      </div>
      <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 6px" role="listbox" aria-label="Exercises">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
          <button onClick="{{r.pick}}" role="option" aria-selected="{{r.selected}}" style="display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; align-items: center; padding: 8px 14px 8px 8px; border: none; border-radius: 18px; background: {{r.bg}}; box-shadow: {{r.shadow}}; color: var(--ink); text-align: left; font-family: 'Geist', sans-serif">
            <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: {{r.thumb}}"></span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 15px; font-weight: 500">{{r.name}}</span>
              <span style="font-size: 13px; color: var(--muted)">{{r.meta}}</span>
            </span>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-label="Exercise detail" style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{frames}}" as="f" hint-placeholder-count="2">
          <div role="img" aria-label="Exercise photo: {{sel.name}}, {{f.label}} position" style="position: relative; overflow: hidden; aspect-ratio: 4 / 3; border-radius: 28px; background: var(--surface); box-shadow: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--faint)">
            <svg width="420" height="420" viewBox="0 0 420 420" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; margin: -210px 0 0 -210px">
              <circle cx="210" cy="210" r="56" fill="none" stroke="#F2542D" stroke-opacity="0.2"></circle><circle cx="210" cy="210" r="96" fill="none" stroke="#F2542D" stroke-opacity="0.13"></circle><circle cx="210" cy="210" r="140" fill="none" stroke="#F2542D" stroke-opacity="0.08"></circle><circle cx="210" cy="210" r="190" fill="none" stroke="#F2542D" stroke-opacity="0.04"></circle>
            </svg>
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="position: relative" aria-hidden="true"><circle cx="17" cy="6" r="2"></circle><path d="M3 17h4l4-3 6 1M11 14l-1-5 5 1"></path></svg>
            <span style="position: absolute; left: 16px; top: 16px; height: 28px; padding: 0 12px; border-radius: 14px; background: var(--bg); color: var(--ink); display: flex; align-items: center; font-size: 13px; font-weight: 500">{{f.label}}</span>
          </div>
        </sc-for>
      </div>

      <div style="margin-top: 26px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">{{sel.name}}</h2>
          <span style="font-size: 15px; color: var(--muted)">{{sel.muscles}}</span>
        </div>
        <div style="display: flex; gap: 8px">
          <a href="GD-Player.dc.html" style="height: 52px; padding: 0 22px; border-radius: 26px; background: var(--surface); box-shadow: var(--card); display: flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 600">Try it</a>
          <button style="height: 52px; padding: 0 24px; border-radius: 26px; border: none; background: var(--ink); color: var(--bg); font-family: 'Geist', sans-serif; font-size: 15px; font-weight: 600">Add to workout</button>
        </div>
      </div>
      <div style="margin-top: 16px; display: flex; gap: 6px; flex-wrap: wrap">
        <span style="height: 30px; padding: 0 14px; border-radius: 15px; background: rgba(242,84,45,0.12); color: var(--pb-ink); display: flex; align-items: center; font-size: 13px; font-weight: 500">Best 12 reps</span>
        <sc-for list="{{tags}}" as="g" hint-placeholder-count="3">
          <span style="height: 30px; padding: 0 14px; border-radius: 15px; background: var(--surface); display: flex; align-items: center; font-size: 13px">{{g}}</span>
        </sc-for>
      </div>
      <ol style="margin: 24px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; max-width: 640px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
          <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 16px; line-height: 1.5">
            <span style="width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">{{s.n}}</span><span style="padding-top: 3px">{{s.t}}</span>
          </li>
        </sc-for>
      </ol>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0, muscle: 'Chest' }; }
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const N = [
      ['Today', 'GD-Today.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['Library', 'GD-Library.dc.html', 'M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5z'],
      ['Progress', 'G-Progress.dc.html', 'M3 20h18M6 20V11M11 20V5M16 20v-6M21 20V9'],
      ['Settings', 'G-Settings.dc.html', 'M4 7h9M17 7h3M15 4v6M4 17h3M11 17h9M9 14v6']
    ];
    const nav = N.map(([label, href, d], i) => ({ label, href, d, current: i === 1 ? 'page' : 'false', bg: i === 1 ? 'var(--ink)' : 'transparent', color: i === 1 ? 'var(--bg)' : 'var(--muted)' }));
    const chips = ['All', 'Chest', 'Core', 'Legs', 'Back', 'Shoulders'].map((label) => {
      const on = this.state.muscle === label;
      return { label, pressed: on ? 'true' : 'false', bg: on ? 'var(--ink)' : 'var(--surface)', ink: on ? 'var(--bg)' : 'var(--ink)', pick: () => this.setState({ muscle: label }) };
    });
    const data = [
      { name: 'Push-up', meta: 'Chest, triceps · Beginner', muscles: 'Chest · also shoulders and triceps', level: 'Beginner' },
      { name: 'Incline push-up', meta: 'Chest, shoulders · Beginner', muscles: 'Chest · also shoulders', level: 'Beginner' },
      { name: 'Decline push-up', meta: 'Chest, shoulders · Intermediate', muscles: 'Upper chest · also shoulders', level: 'Intermediate' },
      { name: 'Wide-grip push-up', meta: 'Chest, triceps · Beginner', muscles: 'Chest · also triceps', level: 'Beginner' },
      { name: 'Push-up to side plank', meta: 'Chest, core · Intermediate', muscles: 'Chest · also core and shoulders', level: 'Intermediate' },
      { name: 'Close-grip push-up', meta: 'Triceps, chest · Beginner', muscles: 'Triceps · also chest', level: 'Beginner' },
      { name: 'Chair dip', meta: 'Triceps, chest · Beginner', muscles: 'Triceps · also chest and shoulders', level: 'Beginner' }
    ];
    const rows = data.map((d, i) => {
      const on = this.state.sel === i;
      return { name: d.name, meta: d.meta, selected: on ? 'true' : 'false', bg: on ? 'var(--surface)' : 'transparent', shadow: on ? '0 1px 3px rgba(18,20,23,0.08)' : 'none', thumb: on ? 'rgba(242,84,45,0.14)' : 'var(--fill2)', pick: () => this.setState({ sel: i }) };
    });
    const sel = data[this.state.sel];
    const frames = [{ label: 'Start' }, { label: 'End' }];
    const tags = [sel.level, 'Body only', 'Compound'];
    const steps = [
      { n: '1', t: 'Hands just wider than shoulders, body in a straight line from head to heels.' },
      { n: '2', t: 'Lower until your chest is a fist above the floor, elbows at about 45°.' },
      { n: '3', t: 'Press back up without letting your hips sag. Breathe out on the way up.' }
    ];
    return { nav, chips, rows, sel, frames, tags, steps };
  }
}
</script>
</body>
</html>
