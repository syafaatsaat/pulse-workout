<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — Desktop Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pl-light{--bg:#F4F2EE;--surface:#FFFFFF;--ink:#121417;--muted:#6B6E76;--faint:#9A9DA4;--placeholder:#8A8D94;--fill:#F4F2EE;--fill2:#ECE9E3;--line:rgba(18,20,23,0.08);--line2:rgba(18,20,23,0.17);--dot:rgba(18,20,23,0.13);--ring:#121417;--card:0 1px 2px rgba(18,20,23,0.04);--hero:#121417;--on-hero:#F4F2EE;--tabbar:#121417;--tabshadow:0 10px 30px rgba(18,20,23,0.18);--danger:#C2361B;--pb-ink:#B5371A;color-scheme:light}
.pl-dark{--bg:#0F1012;--surface:#1A1C20;--ink:#F1EFEA;--muted:#9C9EA6;--faint:#6E7179;--placeholder:#7C7F86;--fill:#26282D;--fill2:#24262B;--line:rgba(241,239,234,0.08);--line2:rgba(241,239,234,0.18);--dot:rgba(241,239,234,0.14);--ring:#F1EFEA;--card:0 0 0 1px rgba(241,239,234,0.06);--hero:#202228;--on-hero:#F1EFEA;--tabbar:#202228;--tabshadow:0 0 0 1px rgba(241,239,234,0.08),0 10px 30px rgba(0,0,0,0.4);--danger:#FF7A63;--pb-ink:#FF8A6B;color-scheme:dark}
a{color:var(--ink)}a:hover{opacity:0.85}
</style>
</helmet>
<div class="pl-{{theme}}" style="min-height: 100vh; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', sans-serif; display: flex; flex-wrap: wrap">
  <svg width="640" height="640" viewBox="0 0 640 640" aria-hidden="true" style="position: absolute; right: -300px; top: -300px; pointer-events: none">
    <sc-for list="{{rings}}" as="r" hint-placeholder-count="6"><circle cx="320" cy="320" r="{{r.r}}" fill="none" stroke="currentColor" style="color: var(--ring)" stroke-opacity="{{r.o}}" stroke-width="1"></circle></sc-for>
  </svg>

  <nav aria-label="Main" style="position: relative; flex: 1 1 220px; box-sizing: border-box; padding: 32px 20px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 32px">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="4" fill="#F2542D"></circle><circle cx="13" cy="13" r="8" fill="none" stroke="#F2542D" stroke-opacity="0.5"></circle><circle cx="13" cy="13" r="12" fill="none" stroke="#F2542D" stroke-opacity="0.25"></circle></svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Pulse</span>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <a href="{{n.href}}" aria-current="{{n.current}}" style="height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 22px; text-decoration: none; background: {{n.bg}}; color: {{n.color}}; font-size: 15px; font-weight: 500">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}
      </a>
    </sc-for>
  </nav>

  <main style="position: relative; flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 56px 56px">
    <div style="max-width: 1120px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; color: var(--muted)">Monday, 2 November</span>
          <span style="font-size: 40px; font-weight: 500; letter-spacing: -0.02em">Good evening</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px 0 8px; border-radius: 28px; background: var(--surface); box-shadow: var(--card)" role="img" aria-label="Weekly goal: 2 of 4 sessions">
          <svg width="40" height="40" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="22" fill="none" stroke="currentColor" style="color: var(--line)" stroke-width="4"></circle><circle cx="26" cy="26" r="22" fill="none" stroke="#F2542D" stroke-width="4" stroke-linecap="round" stroke-dasharray="69.1 138.2" transform="rotate(-90 26 26)"></circle></svg>
          <span style="font-size: 15px; font-weight: 500">2 of 4 this week</span>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
        <section style="flex: 3 1 520px; min-width: 0; position: relative; overflow: hidden; border-radius: 32px; background: var(--hero); color: var(--on-hero); padding: 36px">
          <svg width="640" height="640" viewBox="0 0 640 640" aria-hidden="true" style="position: absolute; right: -260px; bottom: -300px">
            <sc-for list="{{cardRings}}" as="r" hint-placeholder-count="7"><circle cx="320" cy="320" r="{{r.r}}" fill="none" stroke="#F2542D" stroke-opacity="{{r.o}}" stroke-width="1"></circle></sc-for>
          </svg>
          <span style="position: relative; font-size: 14px; color: rgba(244,242,238,0.55)">Up next</span>
          <h1 style="position: relative; margin: 8px 0 0; font-size: 56px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">Push &amp; Core</h1>
          <span style="position: relative; display: block; margin-top: 12px; font-size: 16px; color: rgba(244,242,238,0.6)">9 moves · 28 min · No equipment</span>
          <div style="position: relative; margin-top: 32px; max-width: 520px; display: flex; gap: 4px; height: 5px" role="img" aria-label="Session shape">
            <sc-for list="{{shape}}" as="s" hint-placeholder-count="18">
              <span style="flex-grow: {{s.grow}}; flex-basis: 0; border-radius: 3px; background: {{s.fill}}"></span>
            </sc-for>
          </div>
          <div style="position: relative; margin-top: 28px; max-width: 520px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px">
            <sc-for list="{{moves}}" as="m" hint-placeholder-count="6">
              <div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px solid rgba(244,242,238,0.1); font-size: 14px">
                <span>{{m.name}}</span><span style="color: rgba(244,242,238,0.55)">{{m.dose}}</span>
              </div>
            </sc-for>
          </div>
          <a href="GD-Player.dc.html" style="position: relative; margin-top: 32px; width: 280px; height: 60px; border-radius: 30px; background: #F2542D; color: #131518; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 26px; text-decoration: none; font-size: 17px; font-weight: 600">
            Start session
            <span style="width: 44px; height: 44px; border-radius: 50%; background: #131518; color: #F2542D; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="13 6 19 12 13 18"></polyline></svg>
            </span>
          </a>
        </section>

        <aside style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
          <section style="border-radius: 26px; background: var(--surface); box-shadow: var(--card); padding: 22px 24px">
            <span style="font-size: 16px; font-weight: 500">This week</span>
            <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))" role="img" aria-label="This week: today is Monday, no sessions yet">
              <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
                  <span style="font-size: 12px; color: {{d.ink}}; font-weight: {{d.weight}}">{{d.label}}</span>
                  <span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: {{d.fill}}; box-shadow: {{d.ring}}"></span>
                </div>
              </sc-for>
            </div>
          </section>
          <section style="border-radius: 26px; background: var(--surface); box-shadow: var(--card); padding: 8px 24px">
            <span style="display: block; padding: 14px 0 6px; font-size: 16px; font-weight: 500">Quick start</span>
            <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
              <a href="GD-Player.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 54px; border-top: 1px solid var(--line); text-decoration: none">
                <span style="font-size: 15px">{{q.name}}</span>
                <span style="height: 28px; padding: 0 12px; border-radius: 14px; background: var(--fill); display: flex; align-items: center; font-size: 13px; font-weight: 500">{{q.time}}</span>
              </a>
            </sc-for>
          </section>
          <section style="border-radius: 26px; background: var(--surface); box-shadow: var(--card); padding: 8px 24px">
            <span style="display: block; padding: 14px 0 6px; font-size: 16px; font-weight: 500">Recent bests</span>
            <sc-for list="{{bests}}" as="b" hint-placeholder-count="3">
              <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-top: 1px solid var(--line)">
                <span style="font-size: 15px">{{b.name}}</span>
                <span style="font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums">{{b.v}}</span>
              </div>
            </sc-for>
          </section>
        </aside>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const rings = [60, 120, 180, 240, 300].map((r, i) => ({ r, o: (0.08 - i * 0.014).toFixed(3) }));
    const cardRings = [50, 100, 150, 200, 250, 300, 318].map((r, i) => ({ r, o: (0.5 - i * 0.07).toFixed(2) }));
    const N = [
      ['Today', 'GD-Today.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['Library', 'GD-Library.dc.html', 'M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5z'],
      ['Progress', 'G-Progress.dc.html', 'M3 20h18M6 20V11M11 20V5M16 20v-6M21 20V9'],
      ['Settings', 'G-Settings.dc.html', 'M4 7h9M17 7h3M15 4v6M4 17h3M11 17h9M9 14v6']
    ];
    const nav = N.map(([label, href, d], i) => ({ label, href, d, current: i === 0 ? 'page' : 'false', bg: i === 0 ? 'var(--ink)' : 'transparent', color: i === 0 ? 'var(--bg)' : 'var(--muted)' }));
    const grows = [4, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3];
    const shape = grows.map((g, i) => ({ grow: g, fill: (i === 0 || i === grows.length - 1) ? 'rgba(244,242,238,0.35)' : (i % 2 === 1 ? 'rgba(244,242,238,0.9)' : 'rgba(244,242,238,0.2)') }));
    const moves = [
      { name: 'Incline push-up', dose: '2 × 10' }, { name: 'Plank', dose: '4 × 00:40' },
      { name: 'Dead bug', dose: '2 × 12' }, { name: 'Chair dip', dose: '3 × 10' },
      { name: 'Push-up', dose: '4 × 12' }, { name: '+3 more', dose: '' }
    ];
    const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const week = labels.map((label, i) => ({ label, ink: i === 0 ? 'var(--ink)' : 'var(--muted)', weight: i === 0 ? 600 : 400, fill: i === 0 ? 'transparent' : 'var(--dot)', ring: i === 0 ? 'inset 0 0 0 3px #F2542D' : 'none' }));
    const quick = [{ name: 'Core reset', time: '10 min' }, { name: 'Full body', time: '20 min' }, { name: 'Mobility', time: '12 min' }];
    const bests = [{ name: 'Push-up', v: '12 reps' }, { name: 'Plank', v: '01:30' }, { name: 'Squat', v: '30 reps' }];
    return { rings, cardRings, nav, shape, moves, week, quick, bests };
  }
}
</script>
</body>
</html>
