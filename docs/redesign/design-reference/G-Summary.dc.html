<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — Session complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pl-light{--bg:#F4F2EE;--surface:#FFFFFF;--ink:#121417;--muted:#6B6E76;--faint:#9A9DA4;--placeholder:#8A8D94;--fill:#F4F2EE;--fill2:#ECE9E3;--line:rgba(18,20,23,0.08);--line2:rgba(18,20,23,0.17);--dot:rgba(18,20,23,0.13);--ring:#121417;--card:0 1px 2px rgba(18,20,23,0.04);--hero:#121417;--on-hero:#F4F2EE;--tabbar:#121417;--tabshadow:0 10px 30px rgba(18,20,23,0.18);--danger:#C2361B;--pb-ink:#B5371A;color-scheme:light}
.pl-dark{--bg:#0F1012;--surface:#1A1C20;--ink:#F1EFEA;--muted:#9C9EA6;--faint:#6E7179;--placeholder:#7C7F86;--fill:#26282D;--fill2:#24262B;--line:rgba(241,239,234,0.08);--line2:rgba(241,239,234,0.18);--dot:rgba(241,239,234,0.14);--ring:#F1EFEA;--card:0 0 0 1px rgba(241,239,234,0.06);--hero:#202228;--on-hero:#F1EFEA;--tabbar:#202228;--tabshadow:0 0 0 1px rgba(241,239,234,0.08),0 10px 30px rgba(0,0,0,0.4);--danger:#FF7A63;--pb-ink:#FF8A6B;color-scheme:dark}
a{color:var(--ink)}a:hover{opacity:0.85}
</style>
</helmet>
<div class="pl-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', sans-serif; padding: 60px 24px 30px; display: flex; flex-direction: column">
  <div style="position: relative; height: 200px; display: flex; align-items: center; justify-content: center">
    <svg width="600" height="600" viewBox="0 0 600 600" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; margin: -300px 0 0 -300px; pointer-events: none">
      <sc-for list="{{rings}}" as="r" hint-placeholder-count="6"><circle cx="300" cy="300" r="{{r.r}}" fill="none" stroke="#F2542D" stroke-opacity="{{r.o}}" stroke-width="1"></circle></sc-for>
    </svg>
    <span style="position: relative; width: 80px; height: 80px; border-radius: 50%; background: #F2542D; color: #131518; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(242,84,45,0.3)">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12.5 10 17.5 19 7"></polyline></svg>
    </span>
  </div>
  <h1 style="position: relative; margin: 8px 0 0; text-align: center; font-size: 30px; font-weight: 500; letter-spacing: -0.02em">Session complete</h1>
  <span style="position: relative; margin-top: 6px; text-align: center; font-size: 14px; color: var(--muted)">Push &amp; Core · Monday 2 November</span>

  <div style="position: relative; margin-top: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 22px; background: var(--surface); box-shadow: var(--card); padding: 18px 0">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; border-left: {{s.line}}">
        <span style="font-size: 26px; font-weight: 400; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{s.v}}</span>
        <span style="font-size: 13px; color: var(--muted)">{{s.k}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: relative; margin-top: 12px; border-radius: 22px; background: var(--hero); color: var(--on-hero); padding: 18px 20px; overflow: hidden; display: flex; align-items: center; justify-content: space-between">
    <svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true" style="position: absolute; right: -90px; top: -80px">
      <circle cx="110" cy="110" r="30" fill="none" stroke="#F2542D" stroke-opacity="0.5"></circle><circle cx="110" cy="110" r="55" fill="none" stroke="#F2542D" stroke-opacity="0.32"></circle><circle cx="110" cy="110" r="80" fill="none" stroke="#F2542D" stroke-opacity="0.18"></circle><circle cx="110" cy="110" r="105" fill="none" stroke="#F2542D" stroke-opacity="0.08"></circle>
    </svg>
    <div style="position: relative; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #F2542D; font-weight: 500">New personal best</span>
      <span style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Push-up · 12 reps</span>
    </div>
    <span style="position: relative; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(244,242,238,0.1); display: flex; align-items: center; font-size: 13px; font-weight: 500">+2</span>
  </div>

  <div style="position: relative; margin-top: 12px; border-radius: 22px; background: var(--surface); box-shadow: var(--card); padding: 4px 20px">
    <sc-for list="{{moves}}" as="m" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; border-top: {{m.line}}">
        <span style="font-size: 15px">{{m.name}}</span>
        <span style="font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums">{{m.v}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="G-Today.dc.html" style="position: relative; height: 56px; border-radius: 28px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 600">Done</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const rings = [58, 86, 116, 150, 188, 230].map((r, i) => ({ r, o: (0.35 - i * 0.055).toFixed(3) }));
    const stats = [{ k: 'Time', v: '27:40' }, { k: 'Sets', v: '26' }, { k: 'Reps', v: '214' }]
      .map((s, i) => ({ ...s, line: i === 0 ? 'none' : '1px solid var(--line)' }));
    const moves = [
      { name: 'Push-up', v: '4 × 12' },
      { name: 'Pike push-up', v: '4 × 8' },
      { name: 'Plank', v: '4 × 00:40' }
    ].map((m, i) => ({ ...m, line: i === 0 ? 'none' : '1px solid var(--line)' }));
    return { rings, stats, moves };
  }
}
</script>
</body>
</html>
