<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Manual — Player, rest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{opacity:0.85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E3FAE; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 30px; overflow: hidden">
  <div style="display: flex; gap: 3px; height: 6px" role="img" aria-label="Session progress: resting after set 2 of 4">
    <sc-for list="{{shape}}" as="s" hint-placeholder-count="18">
      <span style="flex-grow: {{s.grow}}; flex-basis: 0; border-radius: 3px; background: {{s.fill}}"></span>
    </sc-for>
  </div>
  <div style="margin-top: 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
    <a href="F-Today.dc.html" aria-label="End session" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">SET 2 OF 4 DONE</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; opacity: 0.75; font-variant-numeric: tabular-nums">12:31 ELAPSED</span>
    </div>
    <span></span>
  </div>

  <div style="margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <span style="height: 26px; padding: 0 12px; border-radius: 13px; background: #FFFFFF; color: #1E3FAE; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1E3FAE"></span>REST</span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 0.95; text-transform: uppercase">Breathe</h1>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 280px; height: 280px" role="img" aria-label="24 of 30 seconds left">
      <svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <circle cx="140" cy="140" r="128" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="10"></circle>
        <circle cx="140" cy="140" r="128" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-dasharray="643.4 804.2" transform="rotate(-90 140 140)"></circle>
      </svg>
      <div style="position: absolute; left: 0; top: 0; width: 280px; height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 120px; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums">0:24</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.8">OF 0:30</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: center; border-radius: 18px; background: rgba(255,255,255,0.1); padding: 12px">
    <div role="img" aria-label="Photo placeholder: Push-up start position" style="width: 76px; height: 76px; border-radius: 12px; background: repeating-linear-gradient(135deg, rgba(255,255,255,0.08) 0 8px, transparent 8px 16px), rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="6" r="2"></circle><path d="M3 17h4l4-3 6 1M11 14l-1-5 5 1"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.8">UP NEXT · SET 3 OF 4</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; text-transform: uppercase">Push-up</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">12 REPS · TEMPO 2·0·1</span>
    </div>
  </div>

  <div style="margin-top: 14px; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px">
    <button style="height: 64px; border-radius: 32px; border: none; background: rgba(255,255,255,0.14); color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 0.04em">+15S</button>
    <a href="F-Player.dc.html" style="height: 64px; border-radius: 32px; background: #FFFFFF; color: #1E3FAE; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 1px">
      SKIP REST
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 5 13 12 6 19"></polyline><line x1="18" y1="5" x2="18" y2="19"></line></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const grows = [4, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3];
    const current = 8;
    const shape = grows.map((g, i) => ({
      grow: g,
      fill: i < current ? 'rgba(255,255,255,0.55)' : (i === current ? '#FFFFFF' : 'rgba(255,255,255,0.18)')
    }));
    return { shape };
  }
}
</script>
</body>
</html>
