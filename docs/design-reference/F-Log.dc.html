<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Manual — Log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th-light{--bg:#F4F3EF;--ink:#111113;--muted:#66666D;--line:#DCDAD3;--line2:#C9C6BE;--fill:#E9E7E1;--dim:#9C9AA1;--rest:#CFCCC4;--bar:#BDBAB2;--surface:#FFFFFF;--danger:#B42318;--card:0 1px 2px rgba(17,17,19,0.05),0 0 0 1px rgba(17,17,19,0.06);--hatch:rgba(17,17,19,0.06);color-scheme:light}
.th-dark{--bg:#121214;--ink:#EDEBE6;--muted:#9D9CA3;--line:#2A2A2E;--line2:#3A3A40;--fill:#232328;--dim:#6C6C73;--rest:#3A3A40;--bar:#4A4A50;--surface:#1A1A1D;--danger:#FF7A6B;--card:0 0 0 1px rgba(255,255,255,0.07);--hatch:rgba(255,255,255,0.05);color-scheme:dark}
a{color:var(--ink)}a:hover{color:var(--muted)}
</style>
</helmet>
<div class="th-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; min-height: 0; padding: 56px 20px 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">14 SESSIONS · 6H 20M</span>
        <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; line-height: 1; text-transform: uppercase">Log</h1>
      </div>
    </div>

    <section style="margin-top: 16px; background: var(--surface); border-radius: 20px; box-shadow: var(--card); padding: 8px 12px 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button aria-label="Previous month" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg></button>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.5px">OCTOBER 2026</span>
        <button aria-label="Next month" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
        <sc-for list="{{dow}}" as="d" hint-placeholder-count="7">
          <span style="text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; color: var(--muted); padding: 4px 0">{{d}}</span>
        </sc-for>
        <sc-for list="{{days}}" as="c" hint-placeholder-count="35">
          <a href="F-Summary.dc.html" aria-label="{{c.aria}}" style="justify-self: center; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; background: {{c.bg}}; color: {{c.ink}}; box-shadow: inset 0 0 0 {{c.ringW}}px #FF5A1F; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; visibility: {{c.vis}}">{{c.n}}</a>
        </sc-for>
      </div>
    </section>

    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: var(--surface); border-radius: 16px; box-shadow: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">{{s.k}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.1">{{s.v}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 18px; display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">PERSONAL BESTS · 6 WEEKS</span>
      <a href="F-Library.dc.html" style="font-size: 13px; font-weight: 500; text-decoration: none; color: var(--muted)">All</a>
    </div>
    <div style="margin-top: 8px; background: var(--surface); border-radius: 18px; box-shadow: var(--card); padding: 0 14px">
      <sc-for list="{{bests}}" as="b" hint-placeholder-count="3">
        <a href="F-Detail.dc.html" style="display: grid; grid-template-columns: minmax(0, 1fr) 66px 64px; gap: 12px; align-items: center; min-height: 58px; border-top: {{b.line}}; text-decoration: none">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.name}}</span>
          <span style="display: flex; gap: 3px; align-items: flex-end; height: 24px" role="img" aria-label="{{b.aria}}">
            <sc-for list="{{b.bars}}" as="v" hint-placeholder-count="6"><span style="flex: 1; height: {{v.h}}px; border-radius: 2px; background: {{v.fill}}"></span></sc-for>
          </span>
          <span style="text-align: right; display: flex; flex-direction: column">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 1">{{b.best}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: var(--muted)">{{b.delta}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 30px; border-top: 1px solid var(--line); background: var(--bg)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" aria-current="{{t.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.color}}; font-size: 11px; font-weight: 600">
        <span style="width: 56px; height: 30px; border-radius: 15px; background: {{t.pill}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        </span>{{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const dow = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const done = [1, 3, 5, 6, 8, 10, 13, 15, 17, 20, 22, 24, 26, 28];
    const days = [];
    for (let i = 0; i < 3; i++) days.push({ n: '', vis: 'hidden', bg: 'transparent', ink: 'var(--ink)', ringW: 0, aria: 'blank' });
    for (let d = 1; d <= 31; d++) {
      const isDone = done.includes(d), today = d === 29;
      days.push({
        n: String(d), vis: 'visible', ringW: today ? 2 : 0,
        bg: isDone ? 'var(--ink)' : 'transparent',
        ink: isDone ? 'var(--bg)' : (d > 29 ? 'var(--dim)' : 'var(--ink)'),
        aria: d + ' October' + (isDone ? ', session logged' : '') + (today ? ', today' : '')
      });
    }
    days.push({ n: '', vis: 'hidden', bg: 'transparent', ink: 'var(--ink)', ringW: 0, aria: 'blank' });
    const stats = [{ k: 'STREAK', v: '3 WKS' }, { k: 'AVG / WK', v: '3.5' }, { k: 'GOAL WKS', v: '3/4' }];
    const mk = (name, vals, best, delta, max) => ({
      name, best, delta, aria: name + ' trend over six weeks',
      bars: vals.map((v, i) => ({ h: Math.max(3, Math.round(v / max * 24)), fill: i === vals.length - 1 ? '#FF5A1F' : 'var(--bar)' }))
    });
    const bests = [
      mk('Pushups', [8, 8, 9, 10, 10, 12], '12', '+2 REPS', 12),
      mk('Plank', [45, 50, 60, 60, 75, 90], '1:30', '+0:15', 90),
      mk('Bodyweight squat', [20, 22, 25, 25, 28, 30], '30', '+2 REPS', 30)
    ].map((b, i) => ({ ...b, line: i === 0 ? 'none' : '1px solid var(--line)' }));
    const T = [
      ['Today', 'F-Today.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['Library', 'F-Library.dc.html', 'M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5zM8 7h7M8 11h5'],
      ['Log', 'F-Log.dc.html', 'M3 20h18M6 20V11M11 20V5M16 20v-6M21 20V9'],
      ['Settings', 'F-Settings.dc.html', 'M4 7h9M17 7h3M15 4v6M4 17h3M11 17h9M9 14v6']
    ];
    const active = 2;
    const tabs = T.map(([label, href, d], i) => ({ label, href, d, current: i === active ? 'page' : 'false', color: i === active ? 'var(--ink)' : 'var(--muted)', pill: i === active ? 'var(--fill)' : 'transparent' }));
    return { dow, days, stats, bests, tabs };
  }
}
</script>
</body>
</html>
