<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Manual — Desktop Player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:0.85}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: {{bg}}; color: {{ink}}; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; padding: 28px 40px 32px; gap: 20px">
  <header style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px">
      <a href="DT-Today.dc.html" style="height: 44px; padding: 0 16px 0 12px; border-radius: 22px; background: {{chip}}; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>End session
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 1px 6px; background: {{chip}}">ESC</span>
      </a>
      <span style="text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em">PUSH &amp; CORE · MOVE 4 OF 9 · SET 2 OF 4</span>
      <span style="height: 44px; padding: 0 16px; border-radius: 22px; background: {{chip}}; display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{elapsed}}</span>
    </div>
    <div style="display: flex; gap: 4px; height: 10px" role="img" aria-label="Session progress: move 4 of 9, set 2 of 4">
      <sc-for list="{{shape}}" as="s" hint-placeholder-count="18">
        <span style="flex-grow: {{s.grow}}; flex-basis: 0; border-radius: 5px; background: {{s.fill}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.75"><span>WARM-UP</span><span>A · WARM</span><span>B · MAIN CIRCUIT ×4</span><span>C · FINISHER</span><span>COOL</span></div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-wrap: wrap; gap: 32px; align-items: center">
    <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <span style="align-self: flex-start; height: 30px; padding: 0 14px; border-radius: 15px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.12em"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{bg}}"></span>{{phaseLabel}}</span>
      <h1 style="margin: 12px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(64px, 7vw, 108px); line-height: 0.92; text-transform: uppercase">{{exercise}}</h1>
      <div style="display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
        <span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(200px, 24vw, 360px); line-height: 1; letter-spacing: -8px; font-variant-numeric: tabular-nums; margin: -0.08em 0 0">{{bigNum}}</span>
        <sc-if value="{{work}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 12px">
            <button aria-label="One rep fewer (left arrow)" style="width: 72px; height: 72px; border-radius: 50%; border: none; background: {{chip}}; color: {{ink}}; font-size: 34px; line-height: 1">−</button>
            <button aria-label="One rep more (right arrow)" style="width: 72px; height: 72px; border-radius: 50%; border: none; background: {{chip}}; color: {{ink}}; font-size: 34px; line-height: 1">+</button>
          </div>
        </sc-if>
      </div>
      <div style="margin-top: 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 0.06em">{{unitLabel}}</span>
        <div style="display: flex; gap: 5px" aria-hidden="true">
          <sc-for list="{{ticks}}" as="t" hint-placeholder-count="12">
            <span style="width: 18px; height: 18px; border-radius: 4px; background: {{t.fill}}; box-shadow: inset 0 0 0 {{t.ring}}px {{ink}}"></span>
          </sc-for>
        </div>
        <sc-if value="{{work}}" hint-placeholder-val="{{ true }}">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; opacity: 0.7">← → ADJUST</span>
        </sc-if>
      </div>
    </section>

    <aside style="flex: 1 1 340px; min-width: 0; max-width: 420px; display: flex; flex-direction: column; gap: 12px">
      <div role="img" aria-label="Photo placeholder: push-up form, crossfades start and end" style="position: relative; aspect-ratio: 4 / 3; border-radius: 22px; background: repeating-linear-gradient(135deg, {{chip}} 0 10px, transparent 10px 20px), {{chip}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.7" aria-hidden="true"><circle cx="17" cy="6" r="2"></circle><path d="M3 17h4l4-3 6 1M11 14l-1-5 5 1"></path></svg>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; opacity: 0.8">Pushups/0.jpg ⇄ 1.jpg</span>
        <span style="position: absolute; left: 14px; top: 14px; height: 26px; padding: 0 10px; border-radius: 13px; background: {{ink}}; color: {{bg}}; display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em">FORM</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 18px; background: {{chip}}">
        <sc-for list="{{facts}}" as="x" hint-placeholder-count="2">
          <div style="padding: 14px 16px; border-left: {{x.line}}; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.75">{{x.k}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.1">{{x.v}}</span></div>
        </sc-for>
      </div>
      <div style="border-radius: 18px; background: {{chip}}; padding: 6px 16px">
        <span style="display: block; padding: 8px 0 4px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.75">UP NEXT</span>
        <sc-for list="{{next}}" as="n" hint-placeholder-count="3">
          <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid {{line}}">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 21px; text-transform: uppercase">{{n.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">{{n.dose}}</span>
          </div>
        </sc-for>
      </div>
    </aside>
  </main>

  <footer style="display: flex; flex-wrap: wrap; gap: 12px">
    <button style="flex: 1 1 180px; height: 84px; border-radius: 42px; border: none; background: {{chip}}; color: {{ink}}; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="9" y1="6" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="18"></line></svg>Pause
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 1px 7px; background: {{chip}}">P</span>
    </button>
    <a href="DT-Player.dc.html" style="flex: 4 1 360px; height: 84px; border-radius: 42px; background: {{ctaBg}}; color: {{ctaInk}}; display: flex; align-items: center; justify-content: center; gap: 18px; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: 1px">
      {{cta}}
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; border-radius: 6px; padding: 3px 10px; box-shadow: inset 0 0 0 1.5px {{ctaInk}}">SPACE</span>
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase":{"editor":"enum","options":["work","rest"],"default":"work"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const rest = (this.props.phase ?? 'work') === 'rest';
    const grows = [4, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3];
    const current = rest ? 8 : 7;
    const on = rest ? '#FFFFFF' : '#111113';
    const past = rest ? 'rgba(255,255,255,0.55)' : 'rgba(17,17,19,0.55)';
    const future = rest ? 'rgba(255,255,255,0.18)' : 'rgba(17,17,19,0.16)';
    const shape = grows.map((g, i) => ({ grow: g, fill: i < current ? past : (i === current ? on : future) }));
    const filled = rest ? 12 : 8;
    const ticks = Array.from({ length: 12 }, (_, i) => ({ fill: i < filled ? on : future, ring: !rest && i === 9 ? 2 : 0 }));
    const base = { shape, ticks, work: !rest };
    return rest ? {
      ...base, bg: '#1E3FAE', ink: '#FFFFFF', chip: 'rgba(255,255,255,0.12)', line: 'rgba(255,255,255,0.2)', elapsed: '12:31',
      phaseLabel: 'REST', exercise: 'Breathe', bigNum: '0:24', unitLabel: 'OF 0:30 · +15S WITH ↑',
      facts: [{ k: 'NEXT', v: 'PUSH-UP · SET 3', line: 'none' }, { k: 'TARGET', v: '12 REPS', line: '1px solid rgba(255,255,255,0.2)' }],
      next: [{ name: 'Push-up · set 3', dose: '12 REPS' }, { name: 'Pike push-up', dose: '8 REPS' }, { name: 'Plank', dose: '0:40' }],
      ctaBg: '#FFFFFF', ctaInk: '#1E3FAE', cta: 'SKIP REST'
    } : {
      ...base, bg: '#FF5A1F', ink: '#111113', chip: 'rgba(17,17,19,0.1)', line: 'rgba(17,17,19,0.15)', elapsed: '11:42',
      phaseLabel: 'WORK', exercise: 'Push-up', bigNum: '08', unitLabel: 'OF 12 REPS',
      facts: [{ k: 'TEMPO', v: '2 · 0 · 1', line: 'none' }, { k: 'LAST TIME', v: '10 REPS', line: '1px solid rgba(17,17,19,0.15)' }],
      next: [{ name: 'Rest', dose: '0:30' }, { name: 'Push-up · set 3', dose: '12 REPS' }, { name: 'Pike push-up', dose: '8 REPS' }],
      ctaBg: '#111113', ctaInk: '#FF5A1F', cta: 'SET DONE'
    };
  }
}
</script>
</body>
</html>
