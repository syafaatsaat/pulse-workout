<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Manual — Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th-light{--bg:#F4F3EF;--ink:#111113;--muted:#66666D;--line:#DCDAD3;--line2:#C9C6BE;--fill:#E9E7E1;--dim:#9C9AA1;--rest:#CFCCC4;--bar:#BDBAB2;--surface:#FFFFFF;--danger:#B42318;--card:0 1px 2px rgba(17,17,19,0.05),0 0 0 1px rgba(17,17,19,0.06);--hatch:rgba(17,17,19,0.06);color-scheme:light}
.th-dark{--bg:#121214;--ink:#EDEBE6;--muted:#9D9CA3;--line:#2A2A2E;--line2:#3A3A40;--fill:#232328;--dim:#6C6C73;--rest:#3A3A40;--bar:#4A4A50;--surface:#1A1A1D;--danger:#FF7A6B;--card:0 0 0 1px rgba(255,255,255,0.07);--hatch:rgba(255,255,255,0.05);color-scheme:dark}
a{color:var(--ink)}a:hover{color:var(--muted)}
input::placeholder{color:var(--muted)}
</style>
</helmet>
<div class="th-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; min-height: 0; padding: 56px 20px 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">FREE-EXERCISE-DB</span>
        <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 36px; line-height: 1; text-transform: uppercase">Library</h1>
      </div>
    </div>

    <div style="margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 8px">
      <label for="lib-search" style="height: 48px; border-radius: 14px; background: var(--surface); box-shadow: var(--card); display: flex; align-items: center; gap: 10px; padding: 0 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--muted); flex-shrink: 0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16" y2="16"></line></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</span>
        <input id="lib-search" type="search" placeholder="Search 800+ exercises" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; color: var(--ink)">
      </label>
      <button aria-label="Equipment filter: Body only" style="height: 48px; border-radius: 14px; border: none; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      </button>
    </div>

    <div style="margin-top: 12px; display: flex; gap: 6px; overflow: hidden">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{c.bg}}; box-shadow: {{c.shadow}}; color: {{c.ink}}; font-size: 13px; font-weight: 600">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="margin-top: 18px; display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">CHEST · BODY ONLY</span>
      <span style="font-size: 13px; color: var(--muted)">Sorted A–Z</span>
    </div>
    <div style="margin-top: 8px; background: var(--surface); border-radius: 18px; box-shadow: var(--card); padding: 0 14px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <a href="F-Detail.dc.html" style="display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 14px; gap: 12px; align-items: center; min-height: 72px; border-top: {{r.line}}; text-decoration: none">
          <span role="img" aria-label="Photo placeholder: {{r.name}}" style="width: 52px; height: 52px; border-radius: 12px; background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px), var(--fill); display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--dim)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="6" r="2"></circle><path d="M3 17h4l4-3 6 1M11 14l-1-5 5 1"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
            <span style="font-size: 13px; color: var(--muted)">{{r.meta}}</span>
          </span>
          <span style="height: 22px; padding: 0 8px; border-radius: 11px; background: var(--fill); display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.04em">{{r.level}}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--dim)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 30px; border-top: 1px solid var(--line); background: var(--bg)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" aria-current="{{t.current}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{t.color}}; font-size: 11px; font-weight: 600">
        <span style="width: 56px; height: 30px; border-radius: 15px; background: {{t.pill}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        </span>{{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { muscle: 'Chest' }; }
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const chips = ['All', 'Chest', 'Core', 'Legs', 'Back', 'Shoulders'].map((label) => {
      const on = this.state.muscle === label;
      return { label, pressed: on ? 'true' : 'false', bg: on ? 'var(--ink)' : 'var(--surface)', ink: on ? 'var(--bg)' : 'var(--ink)', shadow: on ? 'none' : 'var(--card)', pick: () => this.setState({ muscle: label }) };
    });
    const rows = [
      { name: 'Pushups', meta: 'Chest · Triceps', level: 'BEG' },
      { name: 'Incline push-up', meta: 'Chest · Shoulders', level: 'BEG' },
      { name: 'Decline push-up', meta: 'Chest · Shoulders', level: 'INT' },
      { name: 'Wide-grip push-up', meta: 'Chest · Triceps', level: 'BEG' },
      { name: 'Clapping push-up', meta: 'Chest · Triceps', level: 'EXP' },
      { name: 'Push-up to side plank', meta: 'Chest · Core', level: 'INT' }
    ].map((r, i) => ({ ...r, line: i === 0 ? 'none' : '1px solid var(--line)' }));
    const T = [
      ['Today', 'F-Today.dc.html', 'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z'],
      ['Library', 'F-Library.dc.html', 'M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5zM8 7h7M8 11h5'],
      ['Log', 'F-Log.dc.html', 'M3 20h18M6 20V11M11 20V5M16 20v-6M21 20V9'],
      ['Settings', 'F-Settings.dc.html', 'M4 7h9M17 7h3M15 4v6M4 17h3M11 17h9M9 14v6']
    ];
    const active = 1;
    const tabs = T.map(([label, href, d], i) => ({ label, href, d, current: i === active ? 'page' : 'false', color: i === active ? 'var(--ink)' : 'var(--muted)', pill: i === active ? 'var(--fill)' : 'transparent' }));
    return { chips, rows, tabs };
  }
}
</script>
</body>
</html>
