<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Manual — Exercise detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th-light{--bg:#F4F3EF;--ink:#111113;--muted:#66666D;--line:#DCDAD3;--line2:#C9C6BE;--fill:#E9E7E1;--dim:#9C9AA1;--rest:#CFCCC4;--bar:#BDBAB2;--surface:#FFFFFF;--danger:#B42318;--card:0 1px 2px rgba(17,17,19,0.05),0 0 0 1px rgba(17,17,19,0.06);--hatch:rgba(17,17,19,0.06);color-scheme:light}
.th-dark{--bg:#121214;--ink:#EDEBE6;--muted:#9D9CA3;--line:#2A2A2E;--line2:#3A3A40;--fill:#232328;--dim:#6C6C73;--rest:#3A3A40;--bar:#4A4A50;--surface:#1A1A1D;--danger:#FF7A6B;--card:0 0 0 1px rgba(255,255,255,0.07);--hatch:rgba(255,255,255,0.05);color-scheme:dark}
a{color:var(--ink)}a:hover{color:var(--muted)}
</style>
</helmet>
<div class="th-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; min-height: 0; padding: 56px 20px 0; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
      <a href="F-Library.dc.html" aria-label="Back to library" style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface); box-shadow: var(--card); display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>
      </a>
      <span style="text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">EXERCISE</span>
      <span></span>
    </div>

    <div style="margin-top: 14px; position: relative; height: 230px; border-radius: 22px; background: repeating-linear-gradient(135deg, var(--hatch) 0 10px, transparent 10px 20px), var(--fill); box-shadow: var(--card)" role="img" aria-label="Photo placeholder: Pushups, {{frameName}} position">
      <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--muted)">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="6" r="2"></circle><path d="M3 17h4l4-3 6 1M11 14l-1-5 5 1"></path></svg>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">Pushups/{{frameFile}}</span>
      </div>
      <div style="position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(2, 76px); gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface); box-shadow: var(--card)" role="group" aria-label="Photo frame">
        <sc-for list="{{frames}}" as="f" hint-placeholder-count="2">
          <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 32px; border-radius: 9px; border: none; background: {{f.bg}}; color: {{f.ink}}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <h1 style="margin: 18px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 0.95; text-transform: uppercase">Pushups</h1>
    <div style="margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{tags}}" as="g" hint-placeholder-count="5">
        <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: {{g.bg}}; color: {{g.ink}}; display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.06em">{{g.t}}</span>
      </sc-for>
    </div>

    <div style="margin-top: 14px; display: flex; gap: 18px; font-size: 14px">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--ink)"></span><span style="color: var(--muted)">Primary</span> Chest</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink)"></span><span style="color: var(--muted)">Also</span> Shoulders, Triceps</span>
    </div>

    <ol style="margin: 16px 0 0; padding: 4px 16px; list-style: none; background: var(--surface); border-radius: 18px; box-shadow: var(--card)">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <li style="display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: start; padding: 12px 0; border-top: {{s.line}}; font-size: 14px; line-height: 1.45">
          <span style="width: 22px; height: 22px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600">{{s.n}}</span><span>{{s.t}}</span>
        </li>
      </sc-for>
    </ol>
  </div>

  <div style="padding: 12px 20px 30px; border-top: 1px solid var(--line); background: var(--bg); display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px">
    <a href="F-Player.dc.html" style="height: 56px; border-radius: 14px; background: var(--surface); box-shadow: var(--card); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Try it</a>
    <button style="height: 56px; border-radius: 14px; border: none; background: var(--ink); color: var(--bg); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px">+ ADD TO WORKOUT</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { frame: 0 }; }
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const names = ['START', 'END'];
    const frames = names.map((label, i) => {
      const on = this.state.frame === i;
      return { label, pressed: on ? 'true' : 'false', bg: on ? 'var(--ink)' : 'transparent', ink: on ? 'var(--bg)' : 'var(--ink)', pick: () => this.setState({ frame: i }) };
    });
    const tags = [
      { t: 'BEST 12 REPS', bg: '#FF5A1F', ink: '#111113' },
      { t: 'BEGINNER' }, { t: 'PUSH' }, { t: 'COMPOUND' }, { t: 'BODY ONLY' }
    ].map((g) => ({ ...g, bg: g.bg || 'var(--fill)', ink: g.ink || 'var(--ink)' }));
    const steps = [
      { n: '1', t: 'Hands just wider than shoulders, body straight from head to heels.' },
      { n: '2', t: 'Lower until your chest is a fist above the floor, elbows at about 45°.' },
      { n: '3', t: 'Press back up without letting your hips sag. Breathe out as you rise.' }
    ].map((s, i) => ({ ...s, line: i === 0 ? 'none' : '1px solid var(--line)' }));
    return { frames, tags, steps, frameName: names[this.state.frame].toLowerCase(), frameFile: this.state.frame + '.jpg' };
  }
}
</script>
</body>
</html>
