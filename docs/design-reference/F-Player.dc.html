<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Manual — Player, work</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111113}a:hover{opacity:0.8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FF5A1F; color: #111113; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 30px; overflow: hidden">
  <div style="display: flex; gap: 3px; height: 6px" role="img" aria-label="Session progress: move 4 of 9, set 2 of 4">
    <sc-for list="{{shape}}" as="s" hint-placeholder-count="18">
      <span style="flex-grow: {{s.grow}}; flex-basis: 0; border-radius: 3px; background: {{s.fill}}"></span>
    </sc-for>
  </div>
  <div style="margin-top: 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
    <a href="F-Today.dc.html" aria-label="End session" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(17,17,19,0.12); display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">MOVE 4 OF 9 · SET 2 OF 4</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; opacity: 0.75; font-variant-numeric: tabular-nums">11:42 ELAPSED</span>
    </div>
    <a href="F-Detail.dc.html" aria-label="Check form for Push-up" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(17,17,19,0.12); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
    </a>
  </div>

  <div style="margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <span style="height: 26px; padding: 0 12px; border-radius: 13px; background: #111113; color: #FF5A1F; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FF5A1F"></span>WORK</span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 0.95; text-transform: uppercase; text-align: center">Push-up</h1>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 236px; line-height: 1; letter-spacing: -6px; font-variant-numeric: tabular-nums; margin: -18px 0 -22px">08</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em">OF 12 REPS</span>
    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(12, 14px); gap: 4px" role="img" aria-label="8 of 12 reps">
      <sc-for list="{{ticks}}" as="t" hint-placeholder-count="12">
        <span style="height: 14px; border-radius: 3px; background: {{t.fill}}; box-shadow: inset 0 0 0 {{t.ring}}px #111113"></span>
      </sc-for>
    </div>
    <div style="margin-top: 20px; height: 52px; border-radius: 26px; background: rgba(17,17,19,0.12); display: grid; grid-template-columns: 64px 100px 64px; align-items: center">
      <button aria-label="One rep fewer" style="height: 52px; border: none; background: transparent; color: #111113; font-size: 26px; line-height: 1">−</button>
      <span style="text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">ADJUST</span>
      <button aria-label="One rep more" style="height: 52px; border: none; background: transparent; color: #111113; font-size: 26px; line-height: 1">+</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 16px; background: rgba(17,17,19,0.08)">
    <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.75">TEMPO</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px">2·0·1</span></div>
    <div style="padding: 12px 14px; border-left: 1px solid rgba(17,17,19,0.15); display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.75">LAST TIME</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px">10 REPS</span></div>
    <div style="padding: 12px 14px; border-left: 1px solid rgba(17,17,19,0.15); display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.75">NEXT</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px">REST 0:30</span></div>
  </div>

  <div style="margin-top: 14px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px">
    <button aria-label="Pause" style="height: 64px; border-radius: 32px; border: none; background: rgba(17,17,19,0.12); color: #111113; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="9" y1="6" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="18"></line></svg>
    </button>
    <a href="F-Rest.dc.html" style="height: 64px; border-radius: 32px; background: #111113; color: #FF5A1F; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 1px">
      SET DONE
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12.5 10 17.5 19 7"></polyline></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const grows = [4, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3];
    const current = 7;
    const shape = grows.map((g, i) => ({
      grow: g,
      fill: i < current ? 'rgba(17,17,19,0.55)' : (i === current ? '#111113' : 'rgba(17,17,19,0.16)')
    }));
    const ticks = Array.from({ length: 12 }, (_, i) => ({
      fill: i < 8 ? '#111113' : 'rgba(17,17,19,0.14)',
      ring: i === 9 ? 2 : 0
    }));
    return { shape, ticks };
  }
}
</script>
</body>
</html>
