<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Manual — Session summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.th-light{--bg:#F4F3EF;--ink:#111113;--muted:#66666D;--line:#DCDAD3;--line2:#C9C6BE;--fill:#E9E7E1;--dim:#9C9AA1;--rest:#CFCCC4;--bar:#BDBAB2;--surface:#FFFFFF;--danger:#B42318;--card:0 1px 2px rgba(17,17,19,0.05),0 0 0 1px rgba(17,17,19,0.06);--hatch:rgba(17,17,19,0.06);color-scheme:light}
.th-dark{--bg:#121214;--ink:#EDEBE6;--muted:#9D9CA3;--line:#2A2A2E;--line2:#3A3A40;--fill:#232328;--dim:#6C6C73;--rest:#3A3A40;--bar:#4A4A50;--surface:#1A1A1D;--danger:#FF7A6B;--card:0 0 0 1px rgba(255,255,255,0.07);--hatch:rgba(255,255,255,0.05);color-scheme:dark}
a{color:var(--ink)}a:hover{color:var(--muted)}
</style>
</helmet>
<div class="th-{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 30px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <span style="width: 28px; height: 28px; border-radius: 50%; background: #FF5A1F; color: #111113; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12.5 10 17.5 19 7"></polyline></svg>
    </span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em">SESSION COMPLETE</span>
    <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">THU 29 OCT</span>
  </div>
  <h1 style="margin: 16px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 56px; line-height: 0.92; text-transform: uppercase">Push &amp; Core</h1>
  <div style="margin-top: 14px; display: flex; gap: 3px; height: 6px" role="img" aria-label="Every block finished">
    <sc-for list="{{shape}}" as="s" hint-placeholder-count="18">
      <span style="flex-grow: {{s.grow}}; flex-basis: 0; border-radius: 3px; background: var(--ink)"></span>
    </sc-for>
  </div>

  <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border-radius: 18px; box-shadow: var(--card)">
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">TIME</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums">27:40</span></div>
    <div style="padding: 14px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">SETS</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 32px; line-height: 1.1">26/26</span></div>
    <div style="padding: 14px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">REPS</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 32px; line-height: 1.1">214</span></div>
  </div>

  <div style="margin-top: 10px; display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); border-radius: 18px; padding: 14px 16px">
    <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FF5A1F; color: #111113; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; opacity: 0.7">NEW PERSONAL BEST</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; line-height: 1">PUSH-UP · 12 REPS</span>
    </span>
    <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #FF5A1F">+2</span>
  </div>

  <div style="margin-top: 10px; background: var(--surface); border-radius: 18px; box-shadow: var(--card); padding: 4px 16px">
    <sc-for list="{{moves}}" as="m" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 52px 52px; align-items: center; min-height: 46px; border-top: {{m.line}}">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; text-transform: uppercase">{{m.name}}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted)">{{m.sets}}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; text-align: right; color: {{m.bestInk}}">{{m.best}}</span>
      </div>
    </sc-for>
    <a href="F-Log.dc.html" style="display: flex; align-items: center; min-height: 44px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none">+5 more moves</a>
  </div>

  <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted)">HOW HARD WAS IT?</span>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--fill)" role="group" aria-label="Effort, 1 easy to 5 max">
      <sc-for list="{{effort}}" as="e" hint-placeholder-count="5">
        <button onClick="{{e.pick}}" aria-pressed="{{e.pressed}}" style="height: 44px; border-radius: 10px; border: none; background: {{e.bg}}; box-shadow: {{e.shadow}}; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; line-height: 1">{{e.n}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted)">{{e.word}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="F-Log.dc.html" style="height: 56px; border-radius: 14px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.5px">SAVE TO LOG</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { effort: 4 }; }
  renderVals() {
    return Object.assign(this.baseVals(), { theme: this.props.theme === 'dark' ? 'dark' : 'light' });
  }
  baseVals() {
    const grows = [4, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3, 1, 3];
    const shape = grows.map((g) => ({ grow: g }));
    const moves = [
      { name: 'Incline push-up', sets: '2/2', best: '10' },
      { name: 'Push-up', sets: '4/4', best: '12 PB', bestInk: '#FF5A1F' },
      { name: 'Pike push-up', sets: '4/4', best: '8' },
      { name: 'Plank', sets: '4/4', best: '0:45' }
    ].map((m, i) => ({ ...m, bestInk: m.bestInk || 'var(--ink)', line: i === 0 ? 'none' : '1px solid var(--line)' }));
    const words = ['EASY', 'OK', 'SOLID', 'HARD', 'MAX'];
    const effort = words.map((word, i) => {
      const on = this.state.effort === i + 1;
      return {
        n: String(i + 1), word, pressed: on ? 'true' : 'false',
        bg: on ? 'var(--surface)' : 'transparent', shadow: on ? 'var(--card)' : 'none',
        pick: () => this.setState({ effort: i + 1 })
      };
    });
    return { shape, moves, effort };
  }
}
</script>
</body>
</html>
