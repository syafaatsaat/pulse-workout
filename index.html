<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Pulse: a calm home-workout tracker. Big timers you can read from the floor, rest and hold countdowns, personal bests. No sign-up; works with demo data straight away."
    />
    <title>Pulse</title>
    <script>
      // Apply the saved theme before first paint (key matches src/app/theme.ts). The key keeps its
      // Field Manual name so existing visitors keep their choice. theme-color = --bg per theme.
      try {
        var t = localStorage.getItem('fm-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
